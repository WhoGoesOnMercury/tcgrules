<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCG Rules Reference</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F9F9FB] text-[#111827] antialiased min-h-screen flex flex-col selection:bg-slate-900 selection:text-white">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2 font-semibold text-sm tracking-tight text-gray-900">
          <span>TCG Rules</span>
        </a>
      </div>

      <nav class="flex items-center gap-5 text-sm">
        <button type="button" onclick="resetHome()" class="text-gray-500 hover:text-gray-900 transition-colors">
          Index
        </button>
      </nav>
    </div>
  </header>

  <section class="bg-[#14151A] text-white border-b border-gray-800 py-14 sm:py-16 px-4">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">
        Comprehensive Rules &amp; Glossary
      </h1>
      <p class="mt-2 text-sm text-gray-400">
        Direct lookup across official rule sections, keyword abilities, and game terminology.
      </p>

      <form id="searchForm" class="mt-6">
        <div class="relative flex items-center bg-white rounded-md border border-gray-300 focus-within:border-gray-900 shadow-sm">
          <svg class="w-4 h-4 text-gray-400 ml-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="How does cascade work?"
            class="w-full py-3 pl-3 pr-20 text-gray-900 placeholder-gray-400 text-sm focus:outline-none bg-transparent"
            autocomplete="off"
          />
          <button type="submit"
                  class="absolute right-1.5 bg-gray-900 hover:bg-gray-800 text-white text-xs font-medium px-3 py-1.5 rounded transition-colors">
            Search
          </button>
        </div>
      </form>
    </div>
  </section>

  <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 flex-1">

    <div id="resultsContainer" class="hidden">
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-gray-200">
        <h2 id="resultsHeading" class="text-sm font-medium text-gray-700">Results</h2>
        <button type="button" onclick="resetHome()" class="text-xs font-medium text-gray-500 hover:text-gray-900">
          Clear search
        </button>
      </div>
      <div id="resultsList" class="space-y-4"></div>
    </div>

    <div id="defaultFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <div class="bg-white rounded-md border border-gray-200 overflow-hidden">
        <div class="px-5 py-3.5 border-b border-gray-200 bg-gray-50/60 flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-600">Glossary Terms</h2>
          <span class="text-[11px] font-mono text-gray-400">INDEX</span>
        </div>
        <div class="divide-y divide-gray-100">
          {% for item in sample_glossary %}
          <button type="button" onclick="quickSearch('{{ item.term }}')"
                  class="w-full text-left px-5 py-3.5 hover:bg-gray-50 transition-colors flex items-start justify-between gap-4">
            <div class="min-w-0">
              <p class="font-medium text-gray-900 text-sm">{{ item.term }}</p>
              <p class="text-xs text-gray-500 mt-0.5 truncate">{{ item.snippet }}</p>
            </div>
          </button>
          {% endfor %}
        </div>
      </div>

      <div class="bg-white rounded-md border border-gray-200 overflow-hidden">
        <div class="px-5 py-3.5 border-b border-gray-200 bg-gray-50/60 flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-600">Rule Sections</h2>
          <span class="text-[11px] font-mono text-gray-400">SECTIONS</span>
        </div>
        <div class="divide-y divide-gray-100">
          {% for sec in sample_sections %}
          <button type="button" onclick="quickSearch('{{ sec.title }}')"
                  class="w-full text-left px-5 py-3.5 hover:bg-gray-50 transition-colors flex items-start justify-between gap-4">
            <div class="min-w-0">
              <p class="font-medium text-gray-900 text-sm truncate">{{ sec.title }}</p>
              <p class="text-[11px] text-gray-400 mt-0.5 uppercase tracking-wide">{{ sec.tag }}</p>
            </div>
          </button>
          {% endfor %}
        </div>
      </div>

    </div>
  </main>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const defaultFeed = document.getElementById('defaultFeed');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsHeading = document.getElementById('resultsHeading');
    const resultsList = document.getElementById('resultsList');

    function formatRuleLine(line) {
      const escaped = escapeHtml(line);
      const match = escaped.match(/^(\d{3,}\.\d+[a-z]?\.?)\s+(.*)$/);
      if (match) {
        return `<div class="flex items-baseline gap-3 py-1.5 border-b border-gray-100 last:border-0">
                  <span class="font-mono text-xs font-medium text-gray-900 shrink-0 select-all">${match[1]}</span>
                  <span class="text-sm text-gray-700 leading-relaxed">${match[2]}</span>
                </div>`;
      }
      return `<p class="text-sm text-gray-700 leading-relaxed py-1">${escaped}</p>`;
    }

    async function runSearch(query) {
      if (!query.trim()) return;

      defaultFeed.classList.add('hidden');
      resultsContainer.classList.remove('hidden');
      resultsHeading.textContent = `Querying "${query}"...`;
      resultsList.innerHTML = `<div class="bg-white p-5 rounded-md border border-gray-200 text-sm text-gray-500">Searching index...</div>`;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `Server error (${res.status})`);
        }

        if (!data.results || data.results.length === 0) {
          resultsHeading.textContent = `0 matches for "${query}"`;
          resultsList.innerHTML = `<div class="bg-white p-5 rounded-md border border-gray-200 text-sm text-gray-600">No rules or glossary definitions matched that query.</div>`;
          return;
        }

        resultsHeading.textContent = `${data.results.length} result${data.results.length === 1 ? '' : 's'} for "${query}"`;
        resultsList.innerHTML = data.results.map(item => {
          const badgeStyle = item.category === 'GLOSSARY'
            ? 'bg-gray-100 text-gray-800 border-gray-200'
            : 'bg-slate-900 text-white border-slate-900';

          const lines = Array.isArray(item.lines) ? item.lines : (item.body || '').split('\n');
          const pointer = item.pointer || item.title || '';
          const systemTag = item.system
            ? `<span class="font-mono text-[10px] font-medium tracking-wider uppercase px-2 py-0.5 rounded-sm border bg-white text-gray-600 border-gray-300">${escapeHtml(item.system)}</span>`
            : '';
          const linesHtml = lines.map(formatRuleLine).join('');

          return `
            <article class="bg-white rounded-md border border-gray-200 overflow-hidden">
              <div class="px-5 py-3 bg-gray-50/70 border-b border-gray-200 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  ${systemTag}
                  <span class="font-mono text-[10px] font-medium tracking-wider uppercase px-2 py-0.5 rounded-sm border ${badgeStyle}">
                    ${escapeHtml(item.category)}
                  </span>
                </div>
                <span class="font-mono text-xs text-gray-500">${escapeHtml(pointer)}</span>
              </div>
              <div class="px-5 py-4">
                ${linesHtml}
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        resultsHeading.textContent = `Search failed`;
        resultsList.innerHTML = `<div class="bg-white p-5 rounded-md border border-red-200 text-sm text-red-700">${escapeHtml(err.message)}</div>`;
      }
    }

    function quickSearch(text) {
      searchInput.value = text;
      runSearch(text);
    }

    function resetHome() {
      searchInput.value = '';
      resultsContainer.classList.add('hidden');
      defaultFeed.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    searchForm.addEventListener('submit', e => {
      e.preventDefault();
      runSearch(searchInput.value);
    });
  </script>
</body>
</html>
